name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Sentinel secrets: check:bundle fails if they (or their names) reach client assets.
      - run: npm run build
        env:
          TMDB_TOKEN: ryuuji-bundle-sentinel-tmdb
          RYUUJI_PASSCODE: ryuuji-bundle-sentinel-passcode
      - run: npm run check:bundle
        env:
          TMDB_TOKEN: ryuuji-bundle-sentinel-tmdb
          RYUUJI_PASSCODE: ryuuji-bundle-sentinel-passcode
